<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<link rel="canonical" href="{{canonical}}">

<!-- Social preview. Update the URLs if the domain changes. -->
<meta property="og:site_name" content="{{site_name}}">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:url" content="{{canonical}}">
<meta property="og:type" content="website">
<meta property="og:image" content="{{base_url}}/social-card.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="The Plantoir seedling icon beside the words Plantoir, on a cream background.">

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{title}}">
<meta name="twitter:description" content="{{description}}">
<meta name="twitter:image" content="{{base_url}}/social-card.png">

<!-- Mastodon verification. The profile's matching link back to plantoir.app
     is the other half; without it Mastodon shows nothing. -->
<link rel="me" href="https://mastodon.social/@plantoir">

<meta name="theme-color" content="#F7EEDA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1C1A15" media="(prefers-color-scheme: dark)">

<link rel="icon" href="{{up}}icon.png">
<link rel="apple-touch-icon" href="{{up}}icon.png">
<script>
(function() {
  var isWin = /Win/i.test(navigator.platform || (navigator.userAgentData && navigator.userAgentData.platform) || navigator.userAgent);
  if (isWin) {
    document.documentElement.classList.add('is-windows');
    function swap(el) {
      if (el.hasAttribute('data-win-srcset')) el.setAttribute('srcset', el.getAttribute('data-win-srcset'));
      if (el.hasAttribute('data-win-src')) el.setAttribute('src', el.getAttribute('data-win-src'));
      if (el.hasAttribute('data-win-alt')) el.setAttribute('alt', el.getAttribute('data-win-alt'));
    }
    function scan(node) {
      if (node.nodeType !== 1) return;
      swap(node);
      var matches = node.querySelectorAll ? node.querySelectorAll('[data-win-srcset], [data-win-src]') : [];
      for (var i = 0; i < matches.length; i++) swap(matches[i]);
    }
    var observer = new MutationObserver(function(mutations) {
      for (var i = 0; i < mutations.length; i++) {
        var added = mutations[i].addedNodes;
        for (var j = 0; j < added.length; j++) scan(added[j]);
      }
    });
    observer.observe(document.documentElement, { childList: true, subtree: true });
    document.addEventListener('DOMContentLoaded', function() {
      observer.disconnect();
      scan(document.body);
    });
  }
})();
</script>
<link rel="stylesheet" href="{{up}}assets/style.css">
</head>

<body class="{{body_class}}">
<a class="skip-link" href="#main">Skip to the main text</a>
<div class="wrap">

<div class="topbar">
  <a class="brand" href="{{up}}">
    <img src="{{up}}icon.png" alt="">
    <span>Plantoir</span>
  </a>
  <nav class="nav" aria-label="Site">
      {{nav}}
  </nav>
</div>

<main id="main">
{{body}}
</main>

<footer>
  <nav class="footer-nav" aria-label="Pages">
    {{nav_plain}}
  </nav>
  Icon from <a href="https://phosphoricons.com">Phosphor Icons</a> (MIT).<br>
  Designed by <a href="https://www.russellgordon.ca">Russell Gordon</a>.<br>
  Made with Claude.
</footer>

</div>
</body>
</html>
