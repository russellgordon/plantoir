name: Plantoir
options:
  bundleIdPrefix: ca.russellgordon
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true

settings:
  base:
    GENERATE_INFOPLIST_FILE: YES
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    # A real (stable) development signature: ad-hoc signing ("-") changes
    # every rebuild, so macOS forgot the Desktop-access grant each time and
    # asked again. Personal team, matching the personal GitHub account.
    CODE_SIGN_IDENTITY: "Apple Development"
    DEVELOPMENT_TEAM: C7DL9Y9A7R
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: NO
    MACOSX_DEPLOYMENT_TARGET: "15.0"

targets:
  QuartzTeachers:
    type: application
    platform: macOS
    sources:
      - path: QuartzTeachers
      # llama.cpp, run natively so the assistant can reach Metal. A folder
      # reference: llama-server carries an @loader_path rpath, so it finds its
      # dylibs beside itself with no environment fiddling. 25 MB, MIT.
      - path: Vendor/llama
        buildPhase: resources
        type: folder
      # The app icon, authored in Icon Composer.
      - path: Plantoir.icon
        buildPhase: resources
      # The colour schemes and Ontario course lookup are the toolchain's
      # own support files, bundled so the app offers the same choices and
      # suggestions as the command-line wizard.
      - path: ../support/colour_schemes.json
        buildPhase: resources
      - path: ../support/ontario_secondary_courses.json
        buildPhase: resources
      - path: ../support/british_columbia_secondary_courses.json
        buildPhase: resources
      # The launcher scripts, so the app can initialize a brand-new
      # working folder (same files export-scripts would deliver).
      - path: ../setup.sh
        buildPhase: resources
      - path: ../preview.sh
        buildPhase: resources
      - path: ../deploy.sh
        buildPhase: resources
      # The toolchain's full build recipe, so the app can keep a working
      # folder's .toolchain current — the image is built locally from it.
      - path: ../Dockerfile
        buildPhase: resources
      - path: ../patches
        type: folder
        buildPhase: resources
      - path: ../scripts
        type: folder
        buildPhase: resources
      - path: ../support
        type: folder
        buildPhase: resources
      # Read by the scripts themselves (scripts/contracts.py), so it travels
      # with them into .toolchain/ and into the image's build context.
      - path: ../contracts
        type: folder
        buildPhase: resources
      - path: ../setup.bat
        buildPhase: resources
      - path: ../preview.bat
        buildPhase: resources
      - path: ../deploy.bat
        buildPhase: resources
      - path: ../setup.ps1
        buildPhase: resources
      - path: ../preview.ps1
        buildPhase: resources
      - path: ../deploy.ps1
        buildPhase: resources
      # Sparkle's licence. MIT asks that the notice travel with every copy,
      # and a file in the bundle is how llama.cpp's travels too — there is
      # no credit line in the window (rule 1: the name of the machinery is
      # not something a teacher reads while updating).
      - path: Vendor/Sparkle/Sparkle-LICENSE
        buildPhase: resources
    dependencies:
      # How the app finds and installs its own new versions (#204). Fetched by
      # Vendor/fetch-sparkle.sh, pinned by version AND checksum and never
      # committed — the llama.cpp arrangement — so run that script before
      # `xcodegen generate`, or this line names a folder that is not there.
      # CodeSignOnCopy re-signs the framework only, NOT the helpers inside it
      # (Autoupdate, Updater.app); a Release that leaves this Mac is signed
      # item by item by publish.sh (documentation/09-mac-app.md →
      # "Updating itself").
      - framework: Vendor/Sparkle/Sparkle.framework
        embed: true
        codeSign: true
    info:
      path: QuartzTeachers/Info.plist
      properties:
        CFBundleDisplayName: Plantoir
        # Both read the build settings below rather than repeating their
        # values, so a version bump reaches the About panel and the problem
        # report. They were literals until 2026-08-20, which is why every
        # 1.0.0 build also reported build 1.0.0.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSApplicationCategoryType: public.app-category.education
        NSAppTransportSecurity:
          # The embedded preview loads http://localhost:8081 (plain HTTP).
          NSAllowsLocalNetworking: true
        # The sentence macOS shows under "Plantoir would like to access files
        # in your Desktop folder". Without these keys the sheet carries no
        # word from us at all. ONE sentence across all four keys on purpose:
        # a teacher only ever sees one of them, and four near-identical
        # strings drift apart. Rule 1 applies — it is teacher-facing text, and
        # `PrivacyUsageStringsTests` enforces that. The four folders are the
        # ones a working folder is really put in: Desktop and Documents are
        # what the picker suggests, Downloads is where a teacher who
        # downloaded a folder of notes leaves it, and the file-provider key
        # covers the iCloud Drive / Dropbox / OneDrive / Google Drive case the
        # app explicitly supports ("Use This Folder Anyway", see
        # CloudSyncedFolder). Removable and network volumes were considered
        # and REJECTED — documentation/03 §3 says why.
        NSDesktopFolderUsageDescription: "Plantoir reads and writes the course notes in your working folder, so it can build your class websites."
        NSDocumentsFolderUsageDescription: "Plantoir reads and writes the course notes in your working folder, so it can build your class websites."
        NSDownloadsFolderUsageDescription: "Plantoir reads and writes the course notes in your working folder, so it can build your class websites."
        NSFileProviderDomainUsageDescription: "Plantoir reads and writes the course notes in your working folder, so it can build your class websites."
        NSHumanReadableCopyright: "MIT License"
        # Updating itself (#204). The FEED is a build setting, set for Release
        # only (below): a development build carries an EMPTY feed, so it has
        # no updater, no menu item, and never checks anything — decision 5 on
        # #204, "no separate feed for development builds". Every other key is
        # the same in both, so the suite can read them off its own host.
        SUFeedURL: "$(PLANTOIR_UPDATE_FEED_URL)"
        # The public half of the `plantoir-macos` key. An update whose
        # signature does not match it is refused.
        SUPublicEDKey: "lYt8VK8iKB4jMy+b06j1m+GAedeTChAbX5NkMW2FSMw="
        # Ask first (decision 1): CHECK once a day, never download or install
        # without the teacher's click. `SUAllowsAutomaticUpdates` NO also
        # hides the "install automatically" box, and a user default cannot
        # switch it back on.
        SUEnableAutomaticChecks: true
        SUAutomaticallyUpdate: false
        SUAllowsAutomaticUpdates: false
        SUScheduledCheckInterval: 86400
        # The feed itself is signed as well as the download (#204, Q4), so
        # nobody who got into the website could change the notes, the
        # warnings or where the download comes from.
        SUVerifyUpdateBeforeExtraction: true
        SURequireSignedFeed: true
        # NOT `SUEnableInstallerLauncherService`: Plantoir is not sandboxed,
        # and fetch-sparkle.sh removes the services that key would turn on.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ca.russellgordon.Plantoir
        # The user-facing name; the module stays QuartzTeachers internally.
        PRODUCT_NAME: Plantoir
        PRODUCT_MODULE_NAME: QuartzTeachers
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
        # The Icon Composer icon: compiled by the asset tooling, named here.
        ASSETCATALOG_COMPILER_APPICON_NAME: Plantoir
        MARKETING_VERSION: "1.3.1"
        # A PLACEHOLDER for local builds only. A bundle that leaves this Mac
        # is built by publish.sh, which overrides this with
        # `git rev-list --count HEAD` so that no two artifacts ever share a
        # name. Never reset it, and never hand-maintain it here.
        CURRENT_PROJECT_VERSION: "0"
        CODE_SIGN_ENTITLEMENTS: QuartzTeachers/QuartzTeachers.entitlements
        FRAMEWORK_SEARCH_PATHS: "$(PROJECT_DIR)/Vendor/Sparkle"
      configs:
        # Where a released Plantoir looks for a new version — one file per
        # platform on plantoir.app, never a GitHub release asset (#204).
        # `contracts/shared-rules.json` → `appUpdates.feed.mac` says the same,
        # and `AppUpdatesStartTests` pins the two against each other.
        Debug:
          PLANTOIR_UPDATE_FEED_URL: ""
        Release:
          PLANTOIR_UPDATE_FEED_URL: "https://plantoir.app/updates/macos.xml"

  QuartzTeachersTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/QuartzTeachersTests
      - path: Tests/Shared
      # Fixture ingredients: the real launcher scripts and the Example
      # Course's config, so tests can build a disposable workspace.
      - path: ../setup.sh
        buildPhase: resources
      - path: ../preview.sh
        buildPhase: resources
      - path: ../deploy.sh
        buildPhase: resources
      - path: ../support/example_course/EXC2O/course_config.json
        buildPhase: resources
    dependencies:
      - target: QuartzTeachers
    settings:
      base:
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Plantoir.app/Contents/MacOS/Plantoir"
        BUNDLE_LOADER: "$(TEST_HOST)"
        # Instantiated when the test bundle loads, before any test class is
        # enumerated, and all it does is take AppKit's sheet slide animation
        # out of the test host. Without it the host segfaults inside
        # NSMoveHelper's nested runloop every few runs and blames an innocent
        # test — see Tests/QuartzTeachersTests/SheetAnimationSuppressor.swift
        # for the stack, the measurements, and the levers that do not work.
        INFOPLIST_KEY_NSPrincipalClass: PlantoirTestBundleSetup
        # `@testable import QuartzTeachers` loads the Sparkle module too.
        FRAMEWORK_SEARCH_PATHS: "$(PROJECT_DIR)/Vendor/Sparkle"

  QuartzTeachersUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: Tests/QuartzTeachersUITests
      - path: Tests/Shared
      - path: ../setup.sh
        buildPhase: resources
      - path: ../preview.sh
        buildPhase: resources
      - path: ../deploy.sh
        buildPhase: resources
      - path: ../support/example_course/EXC2O/course_config.json
        buildPhase: resources
    dependencies:
      - target: QuartzTeachers
    settings:
      base:
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated

schemes:
  Plantoir:
    build:
      targets:
        QuartzTeachers: all
        QuartzTeachersTests: [test]
        QuartzTeachersUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - QuartzTeachersTests
        - QuartzTeachersUITests
