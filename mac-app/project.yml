name: Plantoir
options:
  bundleIdPrefix: ca.russellgordon
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true

settings:
  base:
    GENERATE_INFOPLIST_FILE: YES
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    # A real (stable) development signature: ad-hoc signing ("-") changes
    # every rebuild, so macOS forgot the Desktop-access grant each time and
    # asked again. Personal team, matching the personal GitHub account.
    CODE_SIGN_IDENTITY: "Apple Development"
    DEVELOPMENT_TEAM: C7DL9Y9A7R
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: NO
    MACOSX_DEPLOYMENT_TARGET: "15.0"

targets:
  QuartzTeachers:
    type: application
    platform: macOS
    sources:
      - path: QuartzTeachers
      # llama.cpp, run natively so the assistant can reach Metal. A folder
      # reference: llama-server carries an @loader_path rpath, so it finds its
      # dylibs beside itself with no environment fiddling. 25 MB, MIT.
      - path: Vendor/llama
        buildPhase: resources
        type: folder
      # The app icon, authored in Icon Composer.
      - path: Plantoir.icon
        buildPhase: resources
      # The colour schemes and Ontario course lookup are the toolchain's
      # own support files, bundled so the app offers the same choices and
      # suggestions as the command-line wizard.
      - path: ../support/colour_schemes.json
        buildPhase: resources
      - path: ../support/ontario_secondary_courses.json
        buildPhase: resources
      - path: ../support/british_columbia_secondary_courses.json
        buildPhase: resources
      # The launcher scripts, so the app can initialize a brand-new
      # working folder (same files export-scripts would deliver).
      - path: ../setup.sh
        buildPhase: resources
      - path: ../preview.sh
        buildPhase: resources
      - path: ../deploy.sh
        buildPhase: resources
      # The toolchain's full build recipe, so the app can keep a working
      # folder's .toolchain current — the image is built locally from it.
      - path: ../Dockerfile
        buildPhase: resources
      - path: ../patches
        type: folder
        buildPhase: resources
      - path: ../scripts
        type: folder
        buildPhase: resources
      - path: ../support
        type: folder
        buildPhase: resources
      # Read by the scripts themselves (scripts/contracts.py), so it travels
      # with them into .toolchain/ and into the image's build context.
      - path: ../contracts
        type: folder
        buildPhase: resources
      - path: ../setup.bat
        buildPhase: resources
      - path: ../preview.bat
        buildPhase: resources
      - path: ../deploy.bat
        buildPhase: resources
      - path: ../setup.ps1
        buildPhase: resources
      - path: ../preview.ps1
        buildPhase: resources
      - path: ../deploy.ps1
        buildPhase: resources
    info:
      path: QuartzTeachers/Info.plist
      properties:
        CFBundleDisplayName: Plantoir
        # Both read the build settings below rather than repeating their
        # values, so a version bump reaches the About panel and the problem
        # report. They were literals until 2026-08-20, which is why every
        # 1.0.0 build also reported build 1.0.0.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSApplicationCategoryType: public.app-category.education
        NSAppTransportSecurity:
          # The embedded preview loads http://localhost:8081 (plain HTTP).
          NSAllowsLocalNetworking: true
        NSHumanReadableCopyright: "MIT License"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ca.russellgordon.Plantoir
        # The user-facing name; the module stays QuartzTeachers internally.
        PRODUCT_NAME: Plantoir
        PRODUCT_MODULE_NAME: QuartzTeachers
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
        # The Icon Composer icon: compiled by the asset tooling, named here.
        ASSETCATALOG_COMPILER_APPICON_NAME: Plantoir
        MARKETING_VERSION: "1.1.0"
        # A PLACEHOLDER for local builds only. A bundle that leaves this Mac
        # is built by publish.sh, which overrides this with
        # `git rev-list --count HEAD` so that no two artifacts ever share a
        # name. Never reset it, and never hand-maintain it here.
        CURRENT_PROJECT_VERSION: "0"
        CODE_SIGN_ENTITLEMENTS: QuartzTeachers/QuartzTeachers.entitlements

  QuartzTeachersTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/QuartzTeachersTests
      - path: Tests/Shared
      # Fixture ingredients: the real launcher scripts and the Example
      # Course's config, so tests can build a disposable workspace.
      - path: ../setup.sh
        buildPhase: resources
      - path: ../preview.sh
        buildPhase: resources
      - path: ../deploy.sh
        buildPhase: resources
      - path: ../support/example_course/EXC2O/course_config.json
        buildPhase: resources
    dependencies:
      - target: QuartzTeachers
    settings:
      base:
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Plantoir.app/Contents/MacOS/Plantoir"
        BUNDLE_LOADER: "$(TEST_HOST)"

  QuartzTeachersUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: Tests/QuartzTeachersUITests
      - path: Tests/Shared
      - path: ../setup.sh
        buildPhase: resources
      - path: ../preview.sh
        buildPhase: resources
      - path: ../deploy.sh
        buildPhase: resources
      - path: ../support/example_course/EXC2O/course_config.json
        buildPhase: resources
    dependencies:
      - target: QuartzTeachers
    settings:
      base:
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated

schemes:
  Plantoir:
    build:
      targets:
        QuartzTeachers: all
        QuartzTeachersTests: [test]
        QuartzTeachersUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - QuartzTeachersTests
        - QuartzTeachersUITests
